<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradingPrint AI - Complete Digits & Scanner Gateway</title>
    <!-- Tailwind CSS -->
    <script src="https://jsdelivr.net"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0B0F19;
            color: #E2E8F0;
            overflow-x: hidden;
        }
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(6, 182, 212, 0.4)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(139, 92, 246, 0.6)); }
        }
        .animate-logo {
            animation: pulse-glow 3s infinite ease-in-out;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0B0F19; }
        ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #06B6D4; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative">

    <div class="absolute inset-0 bg-[linear-gradient(to_right,#141B2D_1px,transparent_1px),linear-gradient(to_bottom,#141B2D_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_50%,#000_70%,transparent_100%)] opacity-40 pointer-events-none"></div>

    <!-- INITIALIZATION SCREEN -->
    <div id="screen-loading" class="fixed inset-0 z-50 bg-[#0B0F19] flex flex-col items-center justify-center p-6 text-center">
        <div class="max-w-md w-full flex flex-col items-center">
            <div class="w-24 h-24 bg-gradient-to-tr from-[#06B6D4] to-[#8B54F6] rounded-2xl flex items-center justify-center mb-6 animate-logo shadow-2xl">
                <i class="fa-solid fa-print text-4xl text-white"></i>
            </div>
            <h1 class="text-3xl font-bold tracking-tight bg-gradient-to-r from-white via-[#06B6D4] to-[#8B54F6] bg-clip-text text-transparent mb-2">
                TradingPrint AI
            </h1>
            <p id="loading-status" class="text-sm text-slate-400 mb-8 font-medium tracking-wide">
                Configuring complete digitized suite variables...
            </p>
        </div>
    </div>

    <!-- MAIN ACCESS GATEWAY -->
    <main id="screen-welcome" class="hidden flex-1 flex flex-col items-center justify-center p-6 text-center relative z-10">
        <div class="max-w-md w-full flex flex-col items-center">
            <div class="w-20 h-20 bg-gradient-to-tr from-[#06B6D4] to-[#8B54F6] rounded-2xl flex items-center justify-center mb-4 shadow-xl shadow-cyan-500/10">
                <i class="fa-solid fa-print text-3xl text-white"></i>
            </div>
            <h2 class="text-2xl font-bold tracking-tight text-white mb-6">TradingPrint AI</h2>
            <div class="w-full space-y-3.5">
                <button onclick="redirectToDerivOAuth()" class="w-full bg-gradient-to-r from-[#06B6D4] to-[#4F46E5] hover:from-[#0891B2] hover:to-[#4338CA] text-white font-semibold py-3.5 px-6 rounded-xl transition duration-300 shadow-lg flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-right-to-bracket text-sm"></i> Secure Log In (No Token Needed)
                </button>
            </div>
        </div>
    </main>

    <!-- LIVE OPERATION WORKSPACE -->
    <div id="app-main" class="hidden flex-1 w-full max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 relative z-10 overflow-y-auto">
        
        <!-- Left Panel Controls -->
        <div class="lg:col-span-1 space-y-6">
            <div class="bg-[#0F172A] border border-slate-800 rounded-2xl p-5 shadow-xl">
                <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-ping"></span>
                        <h2 class="text-sm font-bold tracking-wide text-slate-200">DIGIT CORE ACTIVE</h2>
                    </div>
                    <button onclick="disconnectEngine()" class="text-[11px] bg-rose-500/10 text-rose-400 px-2.5 py-1 rounded-lg border border-rose-500/20 hover:bg-rose-500/20 transition cursor-pointer">Log Out</button>
                </div>
                <div class="grid grid-cols-2 gap-3 text-center">
                    <div class="bg-[#1E293B] p-3 rounded-xl border border-slate-800">
                        <div class="text-[10px] uppercase font-bold text-slate-400">Environment</div>
                        <div id="acc-type" class="text-sm font-bold text-white mt-0.5">-</div>
                    </div>
                    <div class="bg-[#1E293B] p-3 rounded-xl border border-slate-800">
                        <div class="text-[10px] uppercase font-bold text-slate-400">Account Balance</div>
                        <div id="acc-balance" class="text-sm font-bold text-emerald-400 mt-0.5">$0.00</div>
                    </div>
                </div>
            </div>

            <!-- Configuration Parameters -->
            <div class="bg-[#0F172A] border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                <h3 class="text-sm font-bold uppercase tracking-wider text-slate-300"><i class="fa-solid fa-sliders text-cyan-400 mr-1.5"></i> Bot Risk Matrix</h3>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Base Stake ($)</label>
                        <input type="number" id="stake-amount" value="1.00" class="w-full bg-[#1E293B] border border-slate-700/60 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-[#06B6D4]">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Take Profit ($)</label>
                        <input type="number" id="take-profit" value="10.00" class="w-full bg-[#1E293B] border border-slate-700/60 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-[#06B6D4]">
                    </div>
                </div>
                
                <div class="pt-2">
                    <button id="btn-toggle-bot" onclick="toggleBotExecution()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-4 rounded-xl transition shadow-lg flex items-center justify-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-play text-xs"></i> Start AI Auto-Scanner
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Side Matrix Analytics Dashboards -->
        <div class="lg:col-span-2 space-y-6">
            
            <!-- Extended Manual Digits Trader Panel -->
            <div class="bg-[#0F172A] border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                    <h3 class="text-sm font-bold uppercase tracking-wider text-slate-300"><i class="fa-solid fa-fingerprint text-cyan-400 mr-1.5"></i> Manual Digits Terminal (All Modalities)</h3>
                    <div id="last-digit-display" class="text-sm font-mono font-bold bg-[#1E293B] border border-slate-700 text-cyan-400 px-3 py-0.5 rounded-lg flex items-center gap-2">
                        <span>Last Tick LDP:</span> <span id="ldp-value" class="text-white text-base">?</span>
                    </div>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1.5">Prediction Digit / Barrier (0-9)</label>
                        <select id="digit-prediction" class="w-full bg-[#1E293B] border border-slate-700/60 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-[#06B6D4]">
                            <option value="0">0</option><option value="1">1</option><option value="2">2</option>
                            <option value="3">3</option><option value="4">4</option><option value="5" selected>5</option>
                            <option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1.5">Target Asset Market</label>
                        <select id="digit-asset-picker" class="w-full bg-[#1E293B] border border-slate-700/60 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-[#06B6D4]">
                            <option value="1HZ10V">Volatility 10 Index</option>
                            <option value="1HZ50V">Volatility 50 Index</option>
                            <option value="1HZ100V">Volatility 100 Index</option>
                        </select>
                    </div>
                </div>

                <!-- Execution Block Matrix Grid -->
                <div class="space-y-2.5 pt-1">
                    <!-- Layer 1: Match & Differ -->
                    <div class="grid grid-cols-2 gap-3">
