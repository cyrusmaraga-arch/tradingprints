<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradingPrint AI - Seamless OAuth Gateway</title>
    <!-- Tailwind CSS -->
    <script src="https://jsdelivr.net"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0B0F19;
            color: #E2E8F0;
            overflow-x: hidden;
        }
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(6, 182, 212, 0.4)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(139, 92, 246, 0.6)); }
        }
        .animate-logo {
            animation: pulse-glow 3s infinite ease-in-out;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0B0F19; }
        ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #06B6D4; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative">

    <!-- Grid Background Overlay -->
    <div class="absolute inset-0 bg-[linear-gradient(to_right,#141B2D_1px,transparent_1px),linear-gradient(to_bottom,#141B2D_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_50%,#000_70%,transparent_100%)] opacity-40 pointer-events-none"></div>

    <!-- INITIALIZATION SCREEN -->
    <div id="screen-loading" class="fixed inset-0 z-50 bg-[#0B0F19] flex flex-col items-center justify-center p-6 text-center">
        <div class="max-w-md w-full flex flex-col items-center">
            <div class="w-24 h-24 bg-gradient-to-tr from-[#06B6D4] to-[#8B54F6] rounded-2xl flex items-center justify-center mb-6 animate-logo shadow-2xl">
                <i class="fa-solid fa-print text-4xl text-white"></i>
            </div>
            <h1 class="text-3xl font-bold tracking-tight bg-gradient-to-r from-white via-[#06B6D4] to-[#8B54F6] bg-clip-text text-transparent mb-2">
                TradingPrint AI
            </h1>
            <p id="loading-status" class="text-sm text-slate-400 mb-8 font-medium tracking-wide">
                Scanning secure network parameters...
            </p>
            <div class="w-full h-32 bg-[#0F172A]/80 border border-slate-800 rounded-xl p-2 relative overflow-hidden mb-8 shadow-inner flex items-end">
                <canvas id="loadingChart" class="w-full h-full"></canvas>
            </div>
        </div>
    </div>

    <!-- MAIN ACCESS GATEWAY -->
    <main id="screen-welcome" class="hidden flex-1 flex flex-col items-center justify-center p-6 text-center relative z-10">
        <div class="max-w-md w-full flex flex-col items-center">
            <div class="w-20 h-20 bg-gradient-to-tr from-[#06B6D4] to-[#8B54F6] rounded-2xl flex items-center justify-center mb-4 shadow-xl shadow-cyan-500/10">
                <i class="fa-solid fa-print text-3xl text-white"></i>
            </div>
            <h2 class="text-2xl font-bold tracking-tight text-white mb-6">
                TradingPrint AI
            </h2>

            <div class="w-full space-y-3.5">
                <button onclick="redirectToDerivOAuth()" class="w-full bg-gradient-to-r from-[#06B6D4] to-[#4F46E5] hover:from-[#0891B2] hover:to-[#4338CA] text-white font-semibold py-3.5 px-6 rounded-xl transition duration-300 transform active:scale-98 shadow-lg flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-right-to-bracket text-sm"></i> 1. Secure Log In (No Token Needed)
                </button>
                
                <a href="https://deriv.com" target="_blank" class="w-full bg-[#1E293B] hover:bg-[#334155] border border-slate-700/60 text-slate-200 font-medium py-3.5 px-6 rounded-xl transition duration-200 block text-center shadow-md flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-plus text-sm text-cyan-400"></i> 2. Create Account
                </a>

                <a href="https://deriv.com" target="_blank" class="w-full bg-slate-900/80 hover:bg-slate-800/80 border border-slate-800/80 text-slate-300 font-medium py-3.5 px-6 rounded-xl transition duration-200 shadow-md flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-check text-sm text-violet-400"></i> 3. Sign Up
                </a>
            </div>
        </div>
    </main>

    <!-- LIVE OPERATION WORKSPACE -->
    <div id="app-main" class="hidden flex-1 w-full max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 relative z-10 overflow-y-auto">
        <!-- Dashboard Left Panel -->
        <div class="lg:col-span-1 space-y-6">
            <div class="bg-[#0F172A] border border-slate-800 rounded-2xl p-5 shadow-xl">
                <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
                    <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-ping"></span>
                        <h2 class="text-sm font-bold tracking-wide uppercase text-slate-200">OAuth Link Established</h2>
                    </div>
                    <button onclick="disconnectEngine()" class="text-[11px] bg-rose-500/10 text-rose-400 px-2.5 py-1 rounded-lg border border-rose-500/20 hover:bg-rose-500/20 transition cursor-pointer">Log Out</button>
                </div>
                <div class="grid grid-cols-2 gap-3 text-center">
                    <div class="bg-[#1E293B] p-3 rounded-xl border border-slate-800">
                        <div class="text-[10px] uppercase font-bold text-slate-400">Environment</div>
                        <div id="acc-type" class="text-sm font-bold text-white mt-0.5">-</div>
                    </div>
                    <div class="bg-[#1E293B] p-3 rounded-xl border border-slate-800">
                        <div class="text-[10px] uppercase font-bold text-slate-400">Account Balance</div>
                        <div id="acc-balance" class="text-sm font-bold text-emerald-400 mt-0.5">$0.00</div>
                    </div>
                </div>
            </div>

            <!-- Parameters & Risk Safeguards -->
            <div class="bg-[#0F172A] border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
                <h3 class="text-sm font-bold uppercase tracking-wider text-slate-300"><i class="fa-solid fa-sliders text-cyan-400 mr-1.5"></i> Execution Engine</h3>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Target Asset Market</label>
                    <select id="asset-picker" onchange="switchAssetStream()" class="w-full bg-[#1E293B] border border-slate-700/60 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-[#06B6D4]">
                        <option value="1HZ10V">Volatility 10 Index</option>
                        <option value="1HZ50V">Volatility 50 Index</option>
                        <option value="1HZ100V">Volatility 100 Index</option>
                    </select>
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Base Stake ($)</label>
                        <input type="number" id="stake-amount" value="1.00" step="0.5" class="w-full bg-[#1E293B] border border-slate-700/60 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-[#06B6D4]">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Take Profit ($)</label>
                        <input type="number" id="take-profit" value="10.00" step="1" class="w-full bg-[#1E293B] border border-slate-700/60 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-[#06B6D4]">
                    </div>
                </div>

                <div class="pt-2">
                    <button id="btn-toggle-bot" onclick="toggleBotExecution()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-4 rounded-xl transition shadow-lg shadow-emerald-500/10 flex items-center justify-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-play text-xs"></i> Start Trading Engine
                    </button>
                </div>
            </div>
        </div>

        <!-- Dashboard Right Panels (Filled Missing Layout Elements) -->
        <div class="lg:col-span-2 space-y-6">
            <div class="bg-[#0F172A] border border-slate-800 rounded-2xl p-5 shadow-xl min-h-[300px] flex flex-col justify-between">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-sm font-bold uppercase tracking-wider text-slate-300"><i class="fa-solid fa-chart-line text-violet-400 mr-1.5"></i> Market Stream Feed</h3>
                    <div id="live-tick" class="text-sm font-mono font-semibold text-cyan-400">Loading stream...</div>
                </div>
                <div class="flex-1 bg-[#0B0F19] rounded-xl border border-slate-800/80 p-4 flex items-center justify-center">
                    <span class="text-xs text-slate-500">Live ticks and pricing streams display here.</span>
                </div>
            </div>
        </div>
